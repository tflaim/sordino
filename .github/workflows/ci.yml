name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (Chrome and Firefox) and content-script check
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (overlay, popup and settings)
        run: npm run test:smoke
      - name: web-ext lint
        run: npm run lint:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            .output/chrome-mv3
            .output/firefox-mv3
